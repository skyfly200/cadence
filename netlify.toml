# Netlify auto-detects Nuxt and applies the Nitro `netlify` preset,
# building server routes into Netlify Functions. No publish/command
# overrides are needed — setting them wrong breaks the deploy.
#
# Set these in the Netlify UI to enable Google Calendar sync:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   NUXT_PUBLIC_GOOGLE_CLIENT_ID
